name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  ci:
    strategy:
      fail-fast: false  # https://github.com/actions/runner-images#available-images
      matrix:  # https://www.lua.org/versions.html
        os: [macos-26, macos-26-intel, ubuntu-26.04, ubuntu-26.04-arm]
        lua-version: [5.1, 5.2, 5.3, 5.4, 5.5]
    runs-on: ${{ matrix.os }}
    steps:
      - run: echo "${{ runner.os }} on ${{ runner.arch }}"
      - uses: actions/checkout@v7
      - uses: luarocks/gh-actions-lua@master
        with:
          luaVersion: ${{ matrix.lua-version }}
      - uses: luarocks/gh-actions-luarocks@v6
        with:
          luaRocksVersion: 3.13.0
      - run: lua -v && luarocks --version
      - run: luarocks lint rockspecs/datafile-scm-1.rockspec
      - run: luarocks --local make
      - run: luarocks --local install busted
      - run: luarocks list
      - run: luarocks show busted
      - run: $HOME/.luarocks/bin/busted || true
